services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-assignment_system}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/AssignmentSystem.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-assignment_system};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-changeme}"
      Jwt__Issuer: ${JWT_ISSUER:-AssignmentSystem}
      Jwt__Audience: ${JWT_AUDIENCE:-AssignmentSystemClient}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-replace-with-a-long-random-secret-at-least-32-characters}
      Jwt__AccessTokenMinutes: "30"
      Jwt__RefreshTokenDays: "7"
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${API_HOST_PORT:-5080}:8080"
    volumes:
      - api-uploads:/app/wwwroot/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080/api/v1}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  api-uploads:
